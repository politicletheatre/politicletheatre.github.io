<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <script>
    (function() {
      var pathname = window.location.pathname || '';
      // If visiting /ticket or /ticket/... (case-insensitive)
      if (/^\/ticket(\/.*)?$/i.test(pathname)) {
        var correctedPath = pathname.replace(/^\/ticket/i, '/Ticket');
        var newUrl = 'https://politicletheatre.github.io' + correctedPath + window.location.search + window.location.hash;
        window.location.replace(newUrl);
        return;
      }
      // Otherwise redirect to root home
      window.location.replace('https://politicletheatre.github.io/');
    })();
  </script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:50px;background:#08080a;color:#ffffff;">
  <p>กำลังนำท่านไปยังหน้าเว็บ... กรุณารอสักครู่</p>
</body>
</html>
